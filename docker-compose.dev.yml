services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: shared-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    networks:
      - shared-services
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (Bound to localhost for local dev security)
      - "127.0.0.1:9001:9001"   # Web UI Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - shared-services
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # This boots up, configures minio, creates bucket if not already creates
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin}
    networks:
      - shared-services
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set localdev http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}); do echo 'Waiting for minIO API connection...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing localdev/pharmacy-images;
      /usr/bin/mc mb --ignore-existing localdev/pharmacy-qrcodes;
      /usr/bin/mc mb --ignore-existing localdev/myhxcare-images;
      /usr/bin/mc mb --ignore-existing localdev/myhxcare-files;
      /usr/bin/mc anonymous set download localdev/pharmacy-images;
      /usr/bin/mc anonymous set download localdev/pharmacy-qrcodes;
      /usr/bin/mc anonymous set download localdev/myhxcare-images;
      /usr/bin/mc anonymous set download localdev/myhxcare-files;
      echo 'MinIO provisioning finished successfully';
      exit 0;
      "

volumes:
  minio_data:

networks:
  shared-services:
    external: true
